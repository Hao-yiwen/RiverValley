name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: 安装 CPU 与测试依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-chat.txt -r requirements-dev.txt
      - name: 执行完整 CPU 测试
        run: python -m pytest tests/ -q
      - name: 检查全部 Git 跟踪文件
        run: python src/scripts/prepare_open_source_release.py --audit-tracked
      - name: 校验源码发布快照
        run: python src/scripts/prepare_open_source_release.py --source-only --output dist/ci-release
