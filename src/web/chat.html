<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RiverValley · 本地对话</title>
<style>
:root{color-scheme:light;--bg:#f8faf9;--ink:#19312d;--muted:#71817c;--line:#e2e9e5;--green:#207560;--soft:#e7f1eb;--serif:Georgia,'Songti SC',serif}
*{box-sizing:border-box}body{margin:0;font:14px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;color:var(--ink);background:var(--bg)}button,textarea,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #459b82;outline-offset:3px}button{color:inherit}svg{display:block;flex:none}.app{height:100dvh;display:grid;grid-template-columns:244px 1fr;overflow:hidden}
.sidebar{background:#eef3ef;border-right:1px solid var(--line);padding:29px 24px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;font-weight:650;font-size:19px;letter-spacing:-.5px}.brand-icon{background:var(--green);color:white;width:35px;height:35px;border-radius:11px;display:grid;place-items:center}.local-tag{margin-top:10px;color:var(--muted);font-size:11px;letter-spacing:1.8px}.new{display:flex;gap:10px;align-items:center;background:white;border:1px solid #d7e2da;border-radius:9px;padding:11px 13px;width:100%;margin-top:35px;font-weight:550}.nav-label{font-size:10px;letter-spacing:2px;color:#83928b;margin:32px 0 12px}.current{font-size:13px;background:#e0eae2;border-radius:8px;padding:11px 12px;display:flex;align-items:center;gap:10px}.small-dot{width:6px;height:6px;background:var(--green);border-radius:50%}.side-bottom{margin-top:auto;border-top:1px solid #dce5dd;padding-top:20px}.model-name{font-weight:600}.model-note{color:var(--muted);font-size:12px;margin:4px 0 14px}.model-badges{display:flex;gap:6px}.model-badges span{font-size:10px;letter-spacing:.3px;padding:3px 7px;border:1px solid #d3dfd5;border-radius:5px;color:#60756a}.privacy{color:#819086;font-size:11px;margin-top:20px}
.workspace{min-width:0;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 32%,#fff 0%,#fafbf9 50%,#f8faf9 100%)}.topbar{height:79px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 36px;flex:none}.page-name{font-size:14px;font-weight:600}.page-name small{display:block;color:var(--muted);font-size:11px;font-weight:400;margin-top:2px}.status{display:flex;align-items:center;gap:7px;color:#697d72;font-size:12px}.status .small-dot{background:#adbaad}.status.ready .small-dot{background:#3b9970;box-shadow:0 0 0 3px #e6f1e8}.settings{position:relative}.settings summary{list-style:none;cursor:pointer;padding:7px 10px;border:1px solid var(--line);border-radius:7px;font-size:12px;background:#fff}.settings summary::-webkit-details-marker{display:none}.settings-box{position:absolute;z-index:5;right:0;top:43px;width:235px;padding:17px;background:white;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px #19312d12}.settings-box label{display:block;font-size:12px;color:var(--muted);margin-bottom:13px}.settings-box label:last-child{margin-bottom:0}select{width:100%;padding:7px;margin-top:5px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}.header-right{display:flex;align-items:center;gap:18px}
.thread{flex:1;min-height:0;overflow:auto;padding:20px 32px;scroll-behavior:smooth}.welcome{max-width:740px;margin:clamp(25px,9vh,100px) auto 30px;text-align:center}.river-mark{margin:auto auto 22px;width:62px;height:62px;border-radius:19px;display:grid;place-items:center;background:#e8f1e9;color:var(--green);border:1px solid #dce9dd}.eyebrow{font-size:10px;letter-spacing:3px;color:#73907e;font-weight:600}.welcome h1{font-size:clamp(28px,3vw,39px);line-height:1.4;font-weight:500;letter-spacing:-1px;margin:12px 0}.welcome p{font-size:14px;color:var(--muted);margin:0 auto 32px}.suggestions{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:left;max-width:640px;margin:auto}.suggestion{border:1px solid var(--line);border-radius:11px;background:#ffffffa8;padding:17px 18px;text-align:left;transition:.15s}.suggestion:hover{border-color:#90b59c;background:#fff;transform:translateY(-2px)}.suggestion span{display:block;font-size:10px;color:#8c9a91;letter-spacing:1px;margin-bottom:5px}.suggestion strong{font-size:13px;font-weight:500}.suggestion .arrow{float:right;color:#9bad9d;font-size:17px}.welcome-note{font-size:11px!important;margin-top:23px!important;color:#98a49b!important}
.messages{max-width:820px;margin:auto}.message{display:flex;gap:13px;margin:20px 0 28px;align-items:flex-start}.avatar{height:30px;width:30px;border-radius:9px;display:grid;place-items:center;background:var(--soft);color:var(--green);font-size:11px;font-weight:650;flex:none;margin-top:2px}.message-body{max-width:calc(100% - 45px);min-width:0;flex:1}.message-name{font-size:11px;color:#86958c;margin-bottom:8px}.message-text{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.9}.message.user{flex-direction:row-reverse;margin-top:26px}.user .avatar{display:none}.user .message-body{flex:none;max-width:85%;background:#eaf1e9;padding:12px 18px;border-radius:14px 14px 3px 14px}.user .message-name{display:none}.message-meta{display:flex;align-items:center;gap:10px;color:#98a39b;font-size:10px;flex-wrap:wrap;margin-top:12px}.copy{border:0;background:none;color:#92a096;padding:0 2px;font-size:11px}.copy:hover{color:var(--green)}.typing::after{content:' ';display:inline-block;width:6px;height:16px;background:#558c71;vertical-align:middle;border-radius:1px;animation:blink 1s infinite}.waiting{color:#92a396;font-size:12px}.error{color:#b15243;font-size:12px;background:#fcf0ec;border:1px solid #f0d9cf;border-radius:8px;padding:9px 12px;margin-top:10px}.notice{color:#78887c;font-size:11px;margin-top:7px}@keyframes blink{50%{opacity:.15}}
.compose-area{padding:9px 32px 19px;flex:none}.composer-wrap{max-width:820px;margin:auto}.composer{border:1px solid #d9e4dc;border-radius:16px;background:white;padding:16px 16px 11px;box-shadow:0 5px 22px #203d2c07}.composer:focus-within{border-color:#98baa4;box-shadow:0 0 0 3px #eaf2ec}.composer textarea{width:100%;min-height:49px;max-height:160px;resize:none;border:0;outline:none!important;color:var(--ink);background:transparent;line-height:1.6;font-size:14px;padding:0}.composer textarea::placeholder{color:#9aaa9e}.compose-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px}.input-tip{font-size:10px;color:#9ba89e;letter-spacing:.2px}.send{display:flex;align-items:center;justify-content:center;gap:6px;min-width:79px;height:35px;border:0;border-radius:8px;background:var(--green);color:white;font-size:12px}.send.stop{background:#4f6357}.footnote{font-size:10px;text-align:center;color:#94a098;margin-top:10px}.banner{max-width:820px;margin:0 auto 10px;font-size:12px;color:#8b6241}.mobile-new{display:none}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:820px){.app{grid-template-columns:1fr}.sidebar{display:none}.topbar{padding:0 20px;height:70px}.header-right{gap:10px}.mobile-new{display:block;background:none;border:0;padding:5px;font-size:19px}.thread{padding:15px 19px}.compose-area{padding:8px 17px 13px}.welcome{margin-top:40px}.status{font-size:10px}.suggestions{gap:9px}.suggestion{padding:14px 12px}.welcome h1{font-size:30px}.input-tip{font-size:9px}.settings summary{padding:6px 8px}.message-text{font-size:14px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
 <div class="brand"><div class="brand-icon"><svg width="23" height="23" viewBox="0 0 24 24" fill="none"><path d="M4 5c8 0 1 7 9 7s1 7 8 7M3 10c8 0 1 7 9 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></div>RiverValley</div>
 <div class="local-tag">LOCAL CHAT / 本地对话</div>
 <button class="new" id="new-chat"><span style="font-size:21px;font-weight:300">＋</span> 新建对话</button>
 <div class="nav-label">WORKSPACE</div><div class="current"><i class="small-dot"></i>模型试聊</div>
 <div class="side-bottom"><div class="model-name">RiverValley 1B</div><div class="model-note">你的模型，在你的电脑上。</div><div class="model-badges"><span id="model-step">SFT</span><span>1.01B</span></div><div class="privacy">对话只保留在当前页面<br>本机运行，不连接云端模型</div></div>
</aside>
<main class="workspace">
 <header class="topbar"><div class="page-name">模型试聊<small id="model-title">RiverValley 1B · SFT</small></div><div class="header-right"><div id="status" class="status" role="status"><i class="small-dot"></i><span>正在连接本地模型</span></div><details class="settings"><summary>模型与设置</summary><div class="settings-box"><label id="version-label" hidden>本地模型版本<select id="version"></select></label><label>回答长度<select id="max-tokens"><option value="64">简短 · 64 token</option><option value="128" selected>标准 · 128 token</option><option value="256">较长 · 256 token</option></select></label><label>生成方式<select id="temperature"><option value="0" selected>确定性 · 便于对比</option><option value="0.7">自然 · 适度随机</option><option value="1">发散 · 更多随机</option></select></label><label>重复惩罚<select id="repetition"><option value="1" selected>1.0 · 与评估一致</option><option value="1.1">1.1 · 轻度抑制</option><option value="1.15">1.15 · 较强抑制</option></select></label></div></details><button class="mobile-new" id="mobile-new" aria-label="新建对话">＋</button></div></header>
 <section class="thread" id="thread" aria-label="聊天记录">
  <div class="welcome" id="welcome"><div class="river-mark"><svg width="35" height="35" viewBox="0 0 24 24" fill="none"><path d="M4 5c8 0 1 7 9 7s1 7 8 7M3 10c8 0 1 7 9 7" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/></svg></div><div class="eyebrow">MEET YOUR MODEL</div><h1>从一句问题开始。</h1><p>试试中文、英文，或者一个简单的日常问题。</p><div class="suggestions"><button class="suggestion" data-prompt="你好，请用一句话介绍自己。"><span>打个招呼 <b class="arrow">↗</b></span><strong>你好，请用一句话介绍自己。</strong></button><button class="suggestion" data-prompt="9 加 4 等于多少？"><span>简单计算 <b class="arrow">↗</b></span><strong>9 加 4 等于多少？</strong></button><button class="suggestion" data-prompt="What is the capital of France?"><span>ENGLISH <b class="arrow">↗</b></span><strong>What is the capital of France?</strong></button><button class="suggestion" data-prompt="请给我三个保持房间整洁的小建议。"><span>日常建议 <b class="arrow">↗</b></span><strong>保持房间整洁，有什么小建议？</strong></button></div><p class="welcome-note">预训练与 SFT 已完成 · 回答效果由你亲自检验</p></div>
  <div class="messages" id="messages" aria-live="polite" aria-relevant="additions"></div>
 </section>
 <div class="compose-area"><div id="banner" class="banner" role="status"></div><form class="composer-wrap" id="form"><div class="composer"><label for="prompt" class="sr">输入问题</label><textarea id="prompt" placeholder="向 RiverValley 提一个问题…" rows="2" maxlength="16000"></textarea><div class="compose-bottom"><span class="input-tip">Enter 发送 · Shift + Enter 换行</span><button type="submit" class="send" id="send" disabled><span>发送</span><svg width="15" height="15" viewBox="0 0 20 20" fill="none"><path d="M10 16V4m-5 5 5-5 5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div></div><div class="footnote">回答由你训练的模型直接生成，可能不准确。当前对话不会写入训练数据。</div></form></div>
</main>
</div>
<script>
const $ = id => document.getElementById(id);
let history = [], generating = false, ready = false, requestId = null, canStop = false, activeVersion = null;
const deviceNames = {mps:'Apple GPU',cuda:'CUDA GPU',cpu:'CPU'};
function updateButton(){
 $('send').disabled = generating ? !canStop : (!ready || !$('prompt').value.trim());
 $('send').classList.toggle('stop',generating);
 $('send').innerHTML = generating ? '<span>■ 停止</span>' : '<span>发送 ↗</span>';
 $('new-chat').disabled = generating; $('mobile-new').disabled = generating;
 $('max-tokens').disabled = generating; $('temperature').disabled = generating;
 $('repetition').disabled = generating; $('version').disabled = generating || !ready;
}
async function health(){
 try{
  const res = await fetch('/api/status'); if(!res.ok) throw new Error('连接失败'); const data = await res.json();
  ready = data.state === 'ready';
  $('model-title').textContent = data.model_name || 'RiverValley 1B · SFT';
  $('model-step').textContent = Number.isInteger(data.sft_step) ? `SFT · ${data.sft_step} STEPS` : 'SFT';
  if(data.versions){
   $('version-label').hidden = false;
   const list = data.versions.map(v=>({value:v.id,label:v.label}));
   if(JSON.stringify(list)!==$('version').dataset.options){
    $('version').replaceChildren(...list.map(v=>new Option(v.label,v.value)));
    $('version').dataset.options=JSON.stringify(list);
   }
   if(activeVersion && activeVersion!==data.version && !generating) clearChat();
   activeVersion=data.version; $('version').value=data.version;
  } $('status').classList.toggle('ready',ready);
  $('status').querySelector('span').textContent = ready ? `${deviceNames[data.device] || data.device} · 本地运行` : (data.state === 'error' ? '模型加载失败' : '正在加载模型…');
  if(data.state === 'error') $('banner').textContent = data.error;
  else if(!generating) $('banner').textContent = ready ? '' : '首次加载约需几秒钟，准备好后即可发送。';
 }catch(e){ready=false;$('status').classList.remove('ready');$('status').querySelector('span').textContent='本地服务未连接';$('banner').textContent='本地服务没有响应，请重新运行启动命令后刷新页面。';}
 updateButton();
}
function scrollBottom(){ $('thread').scrollTop=$('thread').scrollHeight; }
function addMessage(role,text=''){
 const row=document.createElement('article');row.className=`message ${role}`;
 const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent='RV';row.append(avatar);
 const body=document.createElement('div');body.className='message-body';row.append(body);
 const name=document.createElement('div');name.className='message-name';name.textContent=role==='user'?'你':'RiverValley';body.append(name);
 const content=document.createElement('div');content.className='message-text';content.textContent=text;body.append(content);
 $('messages').append(row);scrollBottom();return {row,body,content};
}
function showError(row,message){const note=document.createElement('div');note.className='error';note.textContent=message;row.body.append(note);}
async function stop(){
 if(!canStop)return;canStop=false;updateButton();
 try{await fetch('/api/cancel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({request_id:requestId})});}
 catch(e){$('banner').textContent='停止请求未送达，请稍后重试。';canStop=true;updateButton();}
}
async function send(){
 if(generating){await stop();return;}const text=$('prompt').value.trim();if(!text||!ready)return;
 generating=true;canStop=false;requestId=crypto.randomUUID();const input={role:'user',content:text};
 $('prompt').value='';$('prompt').style.height='auto';$('welcome').hidden=true;$('banner').textContent='';
 addMessage('user',text);const reply=addMessage('assistant');reply.content.classList.add('typing');
 const waiting=document.createElement('div');waiting.className='waiting';waiting.textContent='正在思考…';reply.body.append(waiting);
 let answer='', finished=false, failed=false;updateButton();
 function receive(event,data){
  if(event==='meta'){canStop=true;updateButton();if(data.dropped_turns){const note=document.createElement('div');note.className='notice';note.textContent=`为保留完整问题，本次已略过最早的 ${data.dropped_turns} 轮历史。`;reply.body.append(note);}}
  if(event==='delta'){waiting.remove();answer+=data.text;reply.content.textContent=answer;scrollBottom();}
  if(event==='error'){failed=true;finished=true;showError(reply,data.message);}
  if(event==='done'){
   finished=true;const meta=document.createElement('div');meta.className='message-meta';
   const reason=data.finish_reason==='cancelled'?'已停止':data.finish_reason==='length'?'达到长度上限':'生成完成';
   const info=document.createElement('span');info.textContent=`${reason} · ${data.output_tokens} token · ${data.elapsed_seconds} 秒 · ${data.tokens_per_second} token/s`;meta.append(info);
   if(answer){const copy=document.createElement('button');copy.className='copy';copy.textContent='复制回答';copy.onclick=async()=>{try{await navigator.clipboard.writeText(answer);copy.textContent='已复制';setTimeout(()=>copy.textContent='复制回答',1500);}catch(e){copy.textContent='请选中文本复制';}};meta.append(copy);}
   else showError(reply,'模型没有生成可见文字，可换一个问题重试。');reply.body.append(meta);
  }
 }
 try{
  const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({request_id:requestId,messages:[...history,input],max_tokens:Number($('max-tokens').value),temperature:Number($('temperature').value),repetition_penalty:Number($('repetition').value)})});
  if(!res.ok){const d=await res.json();throw new Error(d.error||'请求失败');}
  const reader=res.body.getReader(),decoder=new TextDecoder();let buffer='';
  while(true){const {value,done}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});let split;
   while((split=buffer.indexOf('\n\n'))!==-1){const packet=buffer.slice(0,split);buffer=buffer.slice(split+2);let event='',payload='';for(const line of packet.split('\n')){if(line.startsWith('event: '))event=line.slice(7);if(line.startsWith('data: '))payload=line.slice(6);}if(payload)receive(event,JSON.parse(payload));}
  }
  if(!finished)throw new Error('连接提前断开，本次回答可能不完整。');
 }catch(e){failed=true;showError(reply,e.message);}
 finally{
  waiting.remove();reply.content.classList.remove('typing');
  if(answer&&!failed)history.push(input,{role:'assistant',content:answer});
  else if(!answer)$('prompt').value=text;
  generating=false;canStop=false;requestId=null;updateButton();scrollBottom();$('prompt').focus();
 }
}
function clearChat(){if(generating)return;history=[];$('messages').replaceChildren();$('welcome').hidden=false;$('banner').textContent='';$('prompt').value='';updateButton();$('prompt').focus();}
$('form').addEventListener('submit',e=>{e.preventDefault();send();});
$('prompt').addEventListener('input',()=>{const el=$('prompt');el.style.height='auto';el.style.height=Math.min(el.scrollHeight,160)+'px';updateButton();});
$('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();if(!generating)send();}});
$('new-chat').onclick=clearChat;$('mobile-new').onclick=clearChat;
document.querySelectorAll('.suggestion').forEach(el=>el.onclick=()=>{$('prompt').value=el.dataset.prompt;updateButton();$('prompt').focus();});
$('version').onchange=async()=>{
 const chosen=$('version').value; ready=false;updateButton();
 try{
  const response=await fetch('/api/version',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({version:chosen})});
  const data=await response.json();if(!response.ok)throw new Error(data.error||'切换失败');
  clearChat();activeVersion=chosen;
 }catch(error){$('banner').textContent=error.message;$('version').value=activeVersion;}
 await health();
};
health();setInterval(health,5000);
</script>
</body>
</html>
